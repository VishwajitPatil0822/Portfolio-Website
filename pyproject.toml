[project]

name = "vishwajit-portfolio"

version = "1.0.0"

description = "Vishwajit Patil Django portfolio website"

requires-python = "~=3.12.0"

dependencies = [
    "Django==5.2.17",
    "dj-database-url==2.3.0",
    "psycopg2-binary==2.9.11",
    "python-dotenv==1.1.1",
    "asgiref==3.8.1",
    "setuptools==79.0.1",
    "sqlparse==0.5.3",
    "typing_extensions==4.13.2",
    "tzdata==2025.2",
]


[tool.vercel.scripts]

build = "python manage.py migrate && python manage.py collectstatic --noinput"